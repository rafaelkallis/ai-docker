name: Build vLLM (eugr spark)

run-name: "Build v${{ github.run_number }}"

on:
  schedule:
    - cron: '0 * * * *' # Every hour at minute 0
  workflow_dispatch:

concurrency:
  group: build-vllm-eugr-spark
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/vllm-eugr-spark
  UPSTREAM_REPO: eugr/spark-vllm-docker
  UPSTREAM_BRANCH: main

jobs:
  check_upstream_updates:
    runs-on: ubuntu-24.04
    outputs:
      new_commit: ${{ steps.check_commit.outputs.new }}
      new_release: ${{ steps.check_release.outputs.new }}
      release_id: ${{ steps.check_release.outputs.id }}
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@v6

      - name: Check if new commit
        id: check_commit
        run: |
          if ! UPSTREAM_COMMIT_JSON=$(curl -sS -f -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/branches/${{ env.UPSTREAM_BRANCH }}); then
            echo "::error::curl failed fetching branch ${{ env.UPSTREAM_BRANCH }} (HTTP error or network failure)"
            exit 1
          fi
          UPSTREAM_COMMIT=$(echo "$UPSTREAM_COMMIT_JSON" | jq -r '.commit.sha')
          if [ -z "$UPSTREAM_COMMIT" ] || [ "$UPSTREAM_COMMIT" = "null" ]; then
            echo "::error::Failed to fetch upstream commit SHA (empty or null response)"
            exit 1
          fi
          LOCAL_COMMIT=$(cat vllm-eugr-spark/.upstream-commit 2>/dev/null || echo "none")
          if [ "$UPSTREAM_COMMIT" != "$LOCAL_COMMIT" ]; then
            echo "new=true" >> $GITHUB_OUTPUT
          else
            echo "new=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if new release
        id: check_release
        run: |
          if ! UPSTREAM_RELEASE_JSON=$(curl -sS -f -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest); then
            echo "::error::curl failed fetching releases/latest (HTTP error or network failure)"
            exit 1
          fi
          if echo "$UPSTREAM_RELEASE_JSON" | jq -e '.message' > /dev/null 2>&1; then
            echo "::error::GitHub API returned an error for releases/latest: $(echo "$UPSTREAM_RELEASE_JSON" | jq -r '.message')"
            exit 1
          fi
          UPSTREAM_RELEASE_ID=$(echo "$UPSTREAM_RELEASE_JSON" | jq -r '.id')
          if [ -z "$UPSTREAM_RELEASE_ID" ] || [ "$UPSTREAM_RELEASE_ID" = "null" ]; then
            echo "::error::Failed to fetch upstream release ID (empty or null response)"
            exit 1
          fi
          LOCAL_RELEASE_ID=$(cat vllm-eugr-spark/.upstream-release 2>/dev/null || echo "0")
          if [ "$UPSTREAM_RELEASE_ID" != "$LOCAL_RELEASE_ID" ]; then
            echo "new=true" >> $GITHUB_OUTPUT
            echo "id=$UPSTREAM_RELEASE_ID" >> $GITHUB_OUTPUT
          else
            echo "new=false" >> $GITHUB_OUTPUT
          fi

  build_and_push:
    runs-on: ubuntu-24.04-arm
    needs: check_upstream_updates
    if: needs.check_upstream_updates.outputs.new_commit == 'true' || needs.check_upstream_updates.outputs.new_release == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@v6

      - name: Checkout ${{ env.UPSTREAM_REPO }}
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_BRANCH }}
          path: upstream-repo
      
      - name: Log in to the ghcr.io container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build ${{ env.UPSTREAM_REPO }} image
        working-directory: upstream-repo
        run: |
          ./build-and-copy.sh \
            --tag vllm \
            --tf5

      - name: Get dependency versions
        id: dependency-versions
        run: |
          EUGR_REF=$(git -C upstream-repo rev-parse --short HEAD)
          if [ -z "$EUGR_REF" ]; then echo "::error::Failed to get ${{ env.UPSTREAM_REPO }} ref"; exit 1; fi
          echo "eugr-ref=$EUGR_REF" >> $GITHUB_OUTPUT

          VLLM_VERSION=$(docker run --rm vllm python3 -c "import vllm; print(vllm.__version__)" 2>/dev/null | tail -n 1)
          if [ -z "$VLLM_VERSION" ]; then echo "::error::Failed to get vLLM version"; exit 1; fi
          echo "vllm-version=$VLLM_VERSION" >> $GITHUB_OUTPUT
          
          FLASHINFER_VERSION=$(docker run --rm vllm python3 -c "import flashinfer; print(getattr(flashinfer, '__version__', 'unknown'))" 2>/dev/null | tail -n 1)
          if [ -z "$FLASHINFER_VERSION" ]; then echo "::error::Failed to get FlashInfer version"; exit 1; fi
          echo "flashinfer-version=$FLASHINFER_VERSION" >> $GITHUB_OUTPUT
          
      - name: Set image tags
        id: tags
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "dated=${{ env.IMAGE_NAME }}:${DATE}" >> $GITHUB_OUTPUT
          echo "versioned=${{ env.IMAGE_NAME }}:${DATE}-v${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build vLLM Spark image
        run: |
          docker build \
            --file vllm-eugr-spark/Dockerfile \
            --build-arg BASE_IMAGE=vllm \
            --platform linux/arm64 \
            --tag ${{ steps.tags.outputs.versioned }} \
            --tag ${{ steps.tags.outputs.dated }} \
            --label "org.opencontainers.image.title=vLLM Spark" \
            --label "org.opencontainers.image.version=${{ github.run_number }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=${{ steps.tags.outputs.created }}" \
            --label "org.opencontainers.image.description=vLLM Spark image built from ${{ env.UPSTREAM_REPO }}" \
            --label "io.github.eugr.spark-vllm-docker.ref=${{ steps.dependency-versions.outputs.eugr-ref }}" \
            --label "io.github.vllm-project.vllm.version=${{ steps.dependency-versions.outputs.vllm-version }}" \
            --label "io.github.flashinfer-ai.flashinfer.version=${{ steps.dependency-versions.outputs.flashinfer-version }}" \
            ./vllm-eugr-spark
      
      - name: Push the image to the Container registry
        run: |
          docker push ${{ steps.tags.outputs.versioned }}
          docker push ${{ steps.tags.outputs.dated }}
        
      - name: Update upstream commit reference
        run: |
          UPSTREAM_COMMIT=$(git -C upstream-repo rev-parse HEAD)
          echo $UPSTREAM_COMMIT > vllm-eugr-spark/.upstream-commit
          RELEASE_ID="${{ needs.check_upstream_updates.outputs.release_id }}"
          if [ -n "$RELEASE_ID" ]; then
            echo $RELEASE_ID > vllm-eugr-spark/.upstream-release
          fi
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add vllm-eugr-spark/.upstream-commit vllm-eugr-spark/.upstream-release
          git commit -m "Update upstream references (commit: ${UPSTREAM_COMMIT}${RELEASE_ID:+, release-id: ${RELEASE_ID}})" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF#refs/heads/}

      - name: Write job summary
        if: always()
        run: |
          echo "## Built image" >> $GITHUB_STEP_SUMMARY
          echo "- **Versioned**: \`${{ steps.tags.outputs.versioned }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dated**: \`${{ steps.tags.outputs.dated }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **${{ env.UPSTREAM_REPO }} ref**: \`${{ steps.dependency-versions.outputs.eugr-ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **vLLM version**: \`${{ steps.dependency-versions.outputs.vllm-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **FlashInfer version**: \`${{ steps.dependency-versions.outputs.flashinfer-version }}\`" >> $GITHUB_STEP_SUMMARY
